<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waiting for you: words and cursor</title>
<!--
  The layer that goes on top of the 3D film (scripts/motion/blender/film.py): the headlines, a small "sample data"
  note, and the cursor. The cursor goes exactly where the real buttons are in each frame: the film writes those places
  to targets.json, and scripts/motion/render-overlay.mjs puts that file in window.TARGETS before stepping the frames.
  The page is transparent; window.__seek(frame) shows one frame.
-->
<style>
  :root { --ease: cubic-bezier(.22, 1, .36, 1); --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .words { position: absolute; z-index: 2; }
  .words h1 { margin: 0; font-weight: 620; letter-spacing: -.035em; line-height: 1.02; color: #1d1d1f; }
  .words p { margin: 26px 0 0; font-weight: 500; letter-spacing: -.012em; line-height: 1.3; color: #6e6e73; }
  .ln { display: block; overflow: hidden; padding: .08em 0 .16em; margin: -.08em 0 -.16em; }
  .ln > span { display: inline-block; }
  body.landscape .top { left: 0; right: 0; top: 118px; text-align: center; } body.landscape .top h1 { font-size: 112px; } body.landscape .top p { font-size: 38px; }
  body.landscape .left { left: 150px; width: 760px; top: 50%; translate: 0 -58%; } body.landscape .left h1 { font-size: 108px; } body.landscape .left p { font-size: 38px; }
  body.vertical .top, body.vertical .left { left: 80px; right: 80px; top: 170px; text-align: center; translate: none; }
  body.vertical .top h1, body.vertical .left h1 { font-size: 112px; } body.vertical .top p, body.vertical .left p { font-size: 44px; }
  .brand { display: inline-flex; align-items: center; gap: 22px; font-size: 100px; font-weight: 650; letter-spacing: -.045em; color: #1d1d1f; }
  .brand svg { width: .82em; height: .82em; }
  .pill { display: inline-block; margin-top: 28px; padding: 16px 38px; border-radius: 999px; background: #1d1d1f; color: #fff; font-size: 34px; font-weight: 560; letter-spacing: -.01em; }
  #note { position: absolute; z-index: 3; font-size: 22px; font-weight: 500; color: #8e8e93; letter-spacing: .005em; }
  body.landscape #note { right: 48px; bottom: 34px; } body.vertical #note { left: 0; right: 0; bottom: 60px; text-align: center; font-size: 28px; }
  #cursor { position: absolute; left: 0; top: 0; width: 42px; height: 42px; z-index: 5; pointer-events: none; transform-origin: 6px 4px; opacity: 0; }
  #cursor svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 5px rgba(0,0,0,.28)); overflow: visible; }
  #ring { position: absolute; z-index: 4; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 4px solid rgba(10, 110, 240, .55); opacity: 0; pointer-events: none; }
</style>
</head>
<body class="landscape">
<div id="words"></div>
<div id="note">Sample names and amounts</div>
<div id="ring"></div>
<div id="cursor"><svg viewBox="0 0 28 28"><path d="M6 3.5v18.2l4.7-4.4 3 7 3.2-1.4-3-6.8h6.4z" fill="#000" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
<script>
  const FPS = 24;
  const params = new URLSearchParams(location.search);
  const FORMAT = params.get("format") || "landscape";
  document.body.className = FORMAT;
  const LOGO = '<svg viewBox="0 0 40 40" fill="none" stroke="#1d1d1f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="30" height="30" rx="10"/><path d="M15 15v3M25 15v3M14 24c3.2 3.2 8.8 3.2 12 0"/></svg>';
  // Each block: when it arrives and leaves (seconds), where it sits, and its lines.
  const BLOCKS = [
    { t: 1.6, x: 4.3, at: "top", head: ["Meet your sidemates."], sub: "They get things ready while you're away." },
    { t: 4.9, x: 8.9, at: "left", head: ["Waiting", "for you."], sub: "Prepared while you were away.<br>Nothing happens until you say so." },
    { t: 9.6, x: 13.1, at: "left", head: ["You approve."], sub: "Replies are saved as drafts.<br>Never sent." },
    { t: 13.7, x: 18.6, at: "left", head: ["It earns", "your trust."], sub: "Approve the same thing five times,<br>and it offers to do it for you." },
    { t: 19.2, x: 22.6, at: "left", head: ["Undo", "anything."], sub: "Whatever it does on your Mac,<br>you can take back." },
    { t: 23.2, x: 26.6, at: "left", head: ["Month-end?", "One list."], sub: "For your accountant. Only what<br>you approved, as the email says." },
    { t: 27.4, x: 29.5, at: "top", head: ["Your team prepares it.", "You decide."], sub: "" },
    { t: 29.75, x: 99, at: "top", lockup: true },
  ];
  const root = document.getElementById("words");
  const blocks = BLOCKS.map((b) => {
    const el = document.createElement("div");
    el.className = `words ${b.at}`;
    el.innerHTML = b.lockup
      ? `<div class="lk"><span class="brand">${LOGO}sidemates</span></div><div class="lk2"><span class="pill">Free and open source · sidemates.app</span></div>`
      : `<h1>${b.head.map((line) => `<span class="ln"><span>${line}</span></span>`).join("")}</h1>${b.sub ? `<p>${b.sub}</p>` : ""}`;
    root.appendChild(el);
    return { ...b, el, lines: [...el.querySelectorAll(".ln > span")], sub: el.querySelector("p"), lk: el.querySelector(".lk"), lk2: el.querySelector(".lk2") };
  });
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const easeOut = (v) => 1 - Math.pow(1 - clamp(v), 3);
  const easeInOut = (v) => { v = clamp(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
  const lerp = (a, b, v) => a + (b - a) * v;

  function words(t) {
    for (const b of blocks) {
      const out = clamp((t - b.x) / 0.45);                 // leaving: rise a little and fade
      const visible = t >= b.t - 0.01 && out < 1;
      b.el.style.display = visible ? "block" : "none";
      if (!visible) continue;
      b.el.style.opacity = 1 - out;
      b.el.style.transform = `translateY(${-18 * easeInOut(out)}px)`;
      b.lines.forEach((line, i) => {
        const p = easeOut((t - b.t - i * 0.12) / 1.0);
        line.style.transform = `translateY(${(1 - p) * 108}%)`;
        line.style.opacity = p;
      });
      if (b.sub) {
        const p = easeOut((t - b.t - 0.45) / 0.9);
        b.sub.style.opacity = p;
        b.sub.style.transform = `translateY(${(1 - p) * 22}px)`;
        b.sub.style.filter = `blur(${(1 - p) * 6}px)`;
      }
      if (b.lockup) {
        const p1 = easeOut((t - b.t) / 0.9), p2 = easeOut((t - b.t - 0.4) / 0.9);
        b.lk.style.opacity = p1; b.lk.style.transform = `translateY(${(1 - p1) * 26}px)`; b.lk.style.filter = `blur(${(1 - p1) * 8}px)`;
        b.lk2.style.opacity = p2; b.lk2.style.transform = `translateY(${(1 - p2) * 22}px)`;
      }
    }
  }

  // The cursor: it glides in from below right to the real button, presses it, and leaves.
  const cursor = document.getElementById("cursor"), ring = document.getElementById("ring");
  function pointer(frame) {
    const T = window.TARGETS;
    cursor.style.opacity = 0; ring.style.opacity = 0;
    if (!T) return;
    const W = innerWidth, H = innerHeight;
    for (const c of T.clicks) {
      if (frame < c.from || frame > c.to) continue;
      const at = (f) => { const p = c.points[String(Math.max(c.from, Math.min(c.to, f)))]; return [p[0] * W, p[1] * H]; };
      const [tx, ty] = at(frame);
      const arrive = c.click - 5, start = c.from;
      const travel = easeInOut((frame - start) / (arrive - start));
      const x = lerp(tx + 300, tx, travel), y = lerp(ty + 200, ty, travel);
      const press = frame >= c.click - 1 && frame <= c.click + 2 ? 0.84 : 1;
      const fadeIn = clamp((frame - start) / 6), fadeOut = 1 - clamp((frame - (c.to - 8)) / 8);
      cursor.style.opacity = Math.min(fadeIn, fadeOut);
      cursor.style.transform = `translate(${x - 6}px, ${y - 4}px) scale(${press})`;
      if (frame >= c.click) {
        const r = clamp((frame - c.click) / 14);
        ring.style.left = `${tx}px`; ring.style.top = `${ty}px`;
        ring.style.opacity = (1 - r) * 0.9;
        ring.style.transform = `scale(${0.3 + r * 1.4})`;
      }
    }
  }

  window.__frames = Math.round(31.5 * FPS);
  window.__seek = (frame) => { const t = (frame - 1) / FPS; words(t); pointer(frame); return frame; };
  window.__seek(1);
  document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
