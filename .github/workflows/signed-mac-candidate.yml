name: Signed Mac candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: darwin-arm64}
          - {os: macos-15-intel, platform: darwin-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:packaging && npm run test:desktop
      - name: Prepare optional notarization API key
        env:
          OPENBOT_APPLE_API_KEY_P8: ${{ secrets.OPENBOT_APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$OPENBOT_APPLE_API_KEY_P8" ]]; then
            key_path="$RUNNER_TEMP/openbot-notary-key.p8"
            printf '%s' "$OPENBOT_APPLE_API_KEY_P8" > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Build, sign, notarize and assess candidate
        run: npm run package:desktop:signed
        env:
          CSC_LINK: ${{ secrets.OPENBOT_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.OPENBOT_MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.OPENBOT_MAC_CSC_NAME }}
          APPLE_API_KEY_ID: ${{ secrets.OPENBOT_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.OPENBOT_APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.OPENBOT_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.OPENBOT_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.OPENBOT_APPLE_TEAM_ID }}
      - name: Remove temporary notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/openbot-notary-key.p8"
      - name: Record exact artifact checksums
        run: shasum -a 256 desktop/release/*.dmg desktop/release/*.zip > desktop/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sidemates-signed-mac-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/SHA256SUMS.txt
