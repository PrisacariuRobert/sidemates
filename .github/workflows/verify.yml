name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Check public source, not owner runtime data
        run: |
          node --test .github/scripts/check-public-source.test.mjs
          node .github/scripts/check-public-source.mjs
          node scripts/check-static-assets.mjs
      - name: Install code-search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run verify
      - name: Validate private runner Compose bundle
        run: docker compose --env-file deploy/private-runner/.env.example -f deploy/private-runner/docker-compose.yml config --quiet
      - name: Build private runner image
        run: docker build --file deploy/private-runner/Dockerfile --tag openbot-private-runner:verify .
      - name: Smoke test private runner image
        run: |
          docker run --detach --name openbot-private-runner-smoke \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --publish 127.0.0.1:4311:4311 \
            --env OPENBOT_DEPLOYMENT_MODE=private_runner \
            --env OPENBOT_APP_URL=https://studio.example.com/ \
            --env OPENBOT_DATA_DIR=/srv/openbot/data \
            --env OPENBOT_HOST=0.0.0.0 \
            openbot-private-runner:verify
          cleanup() {
            docker logs openbot-private-runner-smoke
            docker rm --force openbot-private-runner-smoke >/dev/null
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4311/api/healthz; then
              docker exec openbot-private-runner-smoke opencode --version
              docker exec openbot-private-runner-smoke npx tsx scripts/test-provider-runtime.ts
              docker exec openbot-private-runner-smoke chromium --version
              docker exec openbot-private-runner-smoke docker info --format '{{.ServerVersion}}'
              access_token="$(docker exec openbot-private-runner-smoke sh -c 'cat /srv/openbot/data/access.token')"
              curl --fail --silent \
                --header "Authorization: Bearer ${access_token}" \
                http://127.0.0.1:4311/api/runner/diagnostics \
                | node -e 'const expected = require("./package.json").version; let value = ""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => { const result = JSON.parse(value); if (result.mode !== "private_runner" || result.version !== expected || result.checks?.length !== 6 || result.alerts?.enabled !== false || result.heartbeat?.configured !== false || result.heartbeat?.enabled !== false) process.exit(1); });'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Validate private runner maintenance scripts
        run: |
          bash -n deploy/private-runner/setup.sh deploy/private-runner/backup.sh deploy/private-runner/update.sh deploy/private-runner/export-home.sh deploy/private-runner/import-home.sh
          node --check deploy/private-runner/home-transfer.mjs

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the lockfile-matched browser
        run: |
          npx --no-install playwright-core install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "playwright-core"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, `OPENBOT_CHROME_PATH=${chromium.executablePath()}\n`);'
      - name: Install the pinned runtime for real provider discovery
        # Keep aligned with deploy/private-runner/Dockerfile. This is a runtime,
        # not a provider account; onboarding uses a new empty credentials home.
        run: |
          npm install --global --prefix "$RUNNER_TEMP/openbot-runtime" --no-audit --no-fund opencode-ai@1.18.28
          test "$("$RUNNER_TEMP/openbot-runtime/bin/opencode" --version)" = "1.18.28"
          echo "$RUNNER_TEMP/openbot-runtime/bin" >> "$GITHUB_PATH"
      - run: npm run build
      - name: Test conversations, first teammate, action review and draft recovery
        run: npm run test:conversation-flow
      - name: Test the complete first-run provider choice journey
        run: npm run test:onboarding
      - name: Test full action review in existing app surfaces
        run: npm run test:app-approvals
      - name: Test keyboard controls, appearance and browser-access states
        run: npm run test:studio-polish
      - name: Test isolated saved-browser sessions
        run: npm run test:browser-sessions
      - name: Test browser tabs and active-tab routing
        run: npm run test:browser-tabs
      - name: Test computer-use admission, journal and executor fixtures
        # Deterministic and credential-free: disposable dirs, loopback HTTP,
        # lockfile Chromium via OPENBOT_CHROME_PATH. No model, provider,
        # live-account or paid prerequisites.
        run: npm run test:r01-http-fixtures && npm run test:computer-use-fixtures
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-acceptance-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/openbot-new-studio-qa/*.png
            /tmp/openbot-first-teammate-qa/*.png
            /tmp/openbot-studio-polish-qa/*.png
            /tmp/openbot-onboarding-qa/*.png
            /tmp/openbot-legacy-review-qa/*.png
